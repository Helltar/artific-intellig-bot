services:

  aibot:
    container_name: aibot-container
    image: ghcr.io/helltar/aibot:latest
    restart: unless-stopped
    env_file: .env
    # to give the bot your own personality: uncomment the lines below and set
    # PERSONALITY_FILE=/app/personality.md in .env, the path on the host is up to you
    # volumes:
    #   - ./personality.md:/app/personality.md:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    container_name: postgres-container
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
